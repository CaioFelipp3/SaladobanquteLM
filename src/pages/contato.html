<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contato – Liliam Müller</title>
    <meta
      name="description"
      content="Entre em contato com a Sala do Banquete."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../styles/global.css" />
    <link rel="stylesheet" href="../styles/contato.css" />
  </head>
  <body data-page="contato">
    <!-- ── Navegação ────────────────────────────────────────────────────────── -->
    <nav id="nav-topo">
      <ul>
        <li><a href="index.html" data-i18n="nav.home">Início</a></li>
        <li>
          <a href="index.html#sobre" data-i18n="nav.sobre"
            >A Sala do Banquete</a
          >
        </li>
        <li>
          <a href="index.html#eventos" data-i18n="nav.eventos">Eventos</a>
        </li>
        <li>
          <a href="index.html#galeria" data-i18n="nav.galeria">Galeria</a>
        </li>
        <li>
          <a href="ingressos.html" data-i18n="nav.ingressos">Ingressos</a>
        </li>
        <li><a href="contato.html" data-i18n="nav.contato">Contato</a></li>
      </ul>
    </nav>

    <!-- ── Conteúdo ─────────────────────────────────────────────────────────── -->
    <main id="page">
      <section class="contato-section reveal">
        <h1 data-i18n="contato.h1">Fale Conosco</h1>
        <p data-i18n="contato.intro"><!-- Texto introdutório --></p>

        <div class="contato-info">
          <!-- WhatsApp -->
          <div class="contato-card reveal">
            <span
              class="contato-card__icone contato-card__icone--wa"
              aria-hidden="true"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path
                  d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"
                />
              </svg>
            </span>
            <div>
              <strong data-i18n="contato.wa">WhatsApp</strong>
              <p>
                <a href="#" id="link-whatsapp" data-i18n="contato.wa.link"
                  >Falar pelo WhatsApp</a
                >
              </p>
            </div>
          </div>

          <!-- Instagram -->
          <div class="contato-card reveal">
            <span
              class="contato-card__icone contato-card__icone--ig"
              aria-hidden="true"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="currentColor"
                width="28"
                height="28"
              >
                <path
                  d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"
                />
              </svg>
            </span>
            <div>
              <strong data-i18n="contato.ig">Instagram</strong>
              <p>
                <a
                  href="#"
                  id="link-instagram"
                  target="_blank"
                  rel="noopener noreferrer"
                  >@<!-- handle --></a
                >
              </p>
            </div>
          </div>

          <!-- E-mail -->
          <div class="contato-card reveal">
            <span class="contato-card__icone" aria-hidden="true">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                width="24"
                height="24"
              >
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
              </svg>
            </span>
            <div>
              <strong data-i18n="contato.email">E-mail</strong>
              <p>
                <a href="#" id="link-email"
                  ><!-- preenchido pelo contato.js --></a
                >
                <button id="email-trocar" hidden>trocar</button>
              </p>
              <div id="email-picker" hidden>
                <p class="email-picker__label">Abrir com:</p>
                <div class="email-picker__opcoes">
                  <button data-mailclient="gmail">Gmail</button>
                  <button data-mailclient="outlook">Outlook</button>
                  <button data-mailclient="yahoo">Yahoo</button>
                  <button data-mailclient="default">Padrão do sistema</button>
                </div>
              </div>
            </div>
          </div>

          <!-- Endereço -->
          <div class="contato-card reveal">
            <span class="contato-card__icone" aria-hidden="true">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                width="24"
                height="24"
              >
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
            </span>
            <div>
              <strong data-i18n="contato.end">Endereço</strong>
              <p>
                <a
                  href="#"
                  id="link-maps"
                  target="_blank"
                  rel="noopener noreferrer"
                  data-i18n="contato.end.val"
                >
                  <!-- preenchido pelo contato.js -->
                </a>
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- ── Rodapé ────────────────────────────────────────────────────────────── -->
    <footer class="rodape">
      <p>
        &copy; <span id="ano-atual"></span> Liliam Müller – A Sala do Banquete.
        <span data-i18n="footer.copy">Todos os direitos reservados.</span>
      </p>
    </footer>

    <!-- ── Botão Voltar ao Topo ──────────────────────────────────────────────── -->
    <button id="btnTopo" aria-label="Voltar ao topo" data-i18n-aria="btn.topo">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        width="22"
        height="22"
        aria-hidden="true"
      >
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    </button>

    <!-- ── Scripts ───────────────────────────────────────────────────────────── -->
    <script src="../scripts/global.js"></script>
    <script src="../scripts/inter.js"></script>
    <script src="../scripts/scroll-reveal.js"></script>
    <script src="../scripts/contato.js"></script>
  </body>
</html>
