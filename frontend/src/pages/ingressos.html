<!doctype html>

      rel="stylesheet"
    />

    <link rel="stylesheet" href="../styles/global.css" />
    <link rel="stylesheet" href="../styles/compras.css" />
  </head>
  <body data-page="ingressos">
    <!-- ── Navegação ────────────────────────────────────────────────────────── -->
    <nav id="nav-topo">
      <ul>
        <li><a href="index.html" data-i18n="nav.home">Início</a></li>
        <li>
          <a href="index.html#sobre" data-i18n="nav.sobre"

        </li>
        <li>

        </li>
        <li>

        <li><a href="contato.html" data-i18n="nav.contato">Contato</a></li>
      </ul>
    </nav>

    <!-- ── Conteúdo ─────────────────────────────────────────────────────────── -->
    <main id="page">
      <section class="compras-section">
        <h1 data-i18n="ingressos.h1">Ingressos</h1>
        <p data-i18n="ingressos.intro"><!-- Texto introdutório da página --></p>

        <div class="produtos-grid">
          <!-- Card Ingresso 1 -->
          <div class="produto-card reveal">
            <div class="produto-card__info">
              <h3 class="produto-card__nome" data-i18n="ing1.nome">
                <!-- Tipo de ingresso 1 -->
              </h3>
              <p class="produto-card__desc" data-i18n="ing1.desc">
                <!-- Descrição -->
              </p>
              <div class="produto-card__btns">
                <a
                  href="#"
                  id="link-ingresso1"
                  class="produto-card__btn produto-card__btn--ml"
                  >Adquirir via MP</a
                >
              </div>
            </div>
          </div>

          <!-- Card Ingresso 2 -->
          <div class="produto-card reveal">
            <div class="produto-card__info">
              <h3 class="produto-card__nome" data-i18n="ing2.nome">
                <!-- Tipo de ingresso 2 -->
              </h3>
              <p class="produto-card__desc" data-i18n="ing2.desc">

              </p>
              <div class="produto-card__btns">
                <a
                  href="#"
                  id="link-ingresso2"

                  >Adquirir via MP</a
                >
              </div>
            </div>
          </div>
        </div>

    <!-- ── Rodapé ────────────────────────────────────────────────────────────── -->

        <span data-i18n="footer.copy">Todos os direitos reservados.</span>
      </p>
    </footer>

    <!-- ── Botão Voltar ao Topo ──────────────────────────────────────────────── -->
    <button id="btnTopo" aria-label="Voltar ao topo" data-i18n-aria="btn.topo">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        width="22"
        height="22"
        aria-hidden="true"
      >
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    </button>

    <!-- ── Scripts ───────────────────────────────────────────────────────────── -->
    <script src="../scripts/inter.js"></script>
